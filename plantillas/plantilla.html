<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vista previa · Webcare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===================== Base común ===================== */
:root{--c:#e8590c}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fb);color:var(--tx);background:var(--bg);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:clip}
main{overflow-x:clip}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.w{max-width:1140px;margin:0 auto;padding:0 24px}
h1,h2,h3,.fh{font-family:var(--fh);font-weight:var(--hw);text-transform:var(--tt);letter-spacing:var(--ls);line-height:1.08}
h1{font-size:clamp(36px,6vw,var(--h1))}
h2{font-size:clamp(28px,4vw,var(--h2));margin-bottom:12px}
h3{font-size:20px;line-height:1.25;margin-bottom:6px}
.acento{color:var(--c)}
.mu{color:var(--mu)}
.kick{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--c);margin-bottom:14px}
section{padding:var(--sp) 0;position:relative}
.alt{background:var(--sf)}
.cab{max-width:640px;margin-bottom:40px}
.cab.centro{margin-left:auto;margin-right:auto;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:var(--bw) solid var(--c);background:var(--c);color:var(--ctx);font-weight:700;padding:14px 26px;border-radius:var(--rb);cursor:pointer;transition:transform .15s,filter .15s,background .15s;text-transform:var(--btt);letter-spacing:var(--bls);font-size:15px;white-space:nowrap}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.btn.s{background:transparent;color:var(--tx);border-color:var(--bd2)}
.btn.s:hover{border-color:var(--c);color:var(--c)}
.ico{width:22px;height:22px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;gap:var(--gap)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:28px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 40%,var(--bd))}
.icb{width:52px;height:52px;border-radius:var(--ri);display:grid;place-items:center;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);margin-bottom:18px}
.icb .ico{width:24px;height:24px}

/* Cabecera */
header{position:sticky;top:0;z-index:20;transition:background .2s,box-shadow .2s}
.nav{display:flex;align-items:center;gap:26px;height:76px}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--fh);font-weight:var(--hw);font-size:21px;letter-spacing:var(--ls);text-transform:var(--tt);min-width:0;flex-shrink:1}
.logo .marca{width:40px;height:40px;border-radius:var(--ri);background:var(--c);color:var(--ctx);display:grid;place-items:center;font-size:18px;flex-shrink:0;overflow:hidden}
.logo .marca img{width:100%;height:100%;object-fit:contain;background:#fff}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.enlaces{display:flex;gap:26px;margin-left:auto;font-size:15px;font-weight:500}
.enlaces a{opacity:.8;transition:opacity .15s,color .15s}.enlaces a:hover{opacity:1;color:var(--c)}
.hamb{display:none;margin-left:auto;background:none;border:0;cursor:pointer;width:42px;height:42px;border-radius:10px}
.hamb i{display:block;width:22px;height:2px;background:currentColor;margin:5px auto;transition:.2s}
.movil{display:none}

/* Héroe */
.heroe{padding:var(--hp) 0}
.heroe .lead{font-size:clamp(17px,1.6vw,20px);color:var(--mu);max-width:52ch;margin:22px 0 32px}
.ctas{display:flex;gap:12px;flex-wrap:wrap}
.confianza{display:flex;gap:22px;flex-wrap:wrap;margin-top:34px;font-size:14px;color:var(--mu)}
.confianza b{color:var(--tx);font-size:22px;display:block;font-family:var(--fh);font-weight:var(--hw)}
.arte{position:relative;border-radius:var(--rh);overflow:hidden;aspect-ratio:var(--ar);background:linear-gradient(140deg,color-mix(in srgb,var(--c) 85%,#fff),color-mix(in srgb,var(--c) 60%,#000))}
.arte svg.ilu{position:absolute;inset:0;width:100%;height:100%}
.chapa{position:absolute;background:var(--card);color:var(--tx);border-radius:var(--rb);padding:12px 16px;font-size:14px;font-weight:600;box-shadow:0 18px 40px -18px rgba(0,0,0,.45);display:flex;align-items:center;gap:10px}
.chapa .ico{color:var(--c)}

/* Franja de confianza / cinta */
.cinta{overflow:hidden;white-space:nowrap;border-block:1px solid var(--bd);padding:18px 0;font-family:var(--fh);font-weight:var(--hw);text-transform:var(--tt);font-size:20px}
.cinta div{display:inline-flex;gap:48px;animation:cinta 30s linear infinite;padding-left:48px}
.cinta span{display:inline-flex;align-items:center;gap:48px}.cinta span::after{content:"✦";color:var(--c)}
@keyframes cinta{to{transform:translateX(-50%)}}

/* Cifras */
.cifras{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
.cifra b{display:block;font-family:var(--fh);font-weight:var(--hw);font-size:clamp(34px,4vw,48px);color:var(--c);line-height:1}
.cifra span{color:var(--mu);font-size:15px}

/* Proceso */
.pasos{counter-reset:p;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
.paso{position:relative;padding-top:58px}
.paso::before{counter-increment:p;content:counter(p,decimal-leading-zero);position:absolute;top:0;left:0;font-family:var(--fh);font-weight:var(--hw);font-size:38px;color:var(--c);line-height:1}

/* Galería */
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:230px;gap:14px}
.gal button{border:0;padding:0;border-radius:var(--r);overflow:hidden;position:relative;cursor:zoom-in;background:none}
.gal button:nth-child(1){grid-row:span 2}
.gal button:nth-child(6){grid-column:span 2}
.foto{position:absolute;inset:0;transition:transform .5s}
.gal button:hover .foto{transform:scale(1.05)}
.gal figcaption{position:absolute;left:12px;bottom:12px;background:var(--card);color:var(--tx);font-size:13px;font-weight:600;padding:7px 12px;border-radius:var(--rb)}
.visor{position:fixed;inset:0;z-index:60;background:rgba(5,6,10,.86);display:none;place-items:center;padding:24px}
.visor.on{display:grid}
.visor .marco{width:min(860px,100%);aspect-ratio:16/10;border-radius:var(--r);overflow:hidden;position:relative}
.visor p{color:#fff;text-align:center;margin-top:14px;font-weight:600}
.visor .cerrar{position:absolute;top:18px;right:22px;background:#fff;border:0;width:44px;height:44px;border-radius:50%;font-size:22px;cursor:pointer}

/* Opiniones */
.ops{position:relative}
.op{display:none}.op.on{display:block;animation:entra .5s}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}
.op blockquote{font-family:var(--fq);font-size:clamp(22px,2.6vw,30px);line-height:1.35;max-width:820px}
.op .quien{display:flex;align-items:center;gap:12px;margin-top:24px}
.op .av{width:46px;height:46px;border-radius:50%;background:color-mix(in srgb,var(--c) 22%,var(--sf));color:var(--c);display:grid;place-items:center;font-weight:700}
.estr{color:#f5a524;letter-spacing:3px;font-size:18px;margin-bottom:14px}
.puntos{display:flex;gap:8px;margin-top:28px}
.puntos button{width:10px;height:10px;border-radius:99px;border:0;background:var(--bd2);cursor:pointer;transition:width .2s}
.puntos button.on{width:28px;background:var(--c)}

/* Preguntas */
.faq details{border-bottom:1px solid var(--bd);padding:20px 0}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:16px;font-weight:600;font-size:18px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--c);font-size:24px;line-height:1;transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{color:var(--mu);margin-top:10px;max-width:70ch}

/* Banda final y contacto */
.banda{border-radius:var(--rh);padding:clamp(36px,6vw,64px);background:var(--c);color:var(--ctx);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.banda h2{margin:0;max-width:22ch}
.banda .btn{background:var(--ctx);color:var(--c);border-color:var(--ctx)}
.form{display:grid;gap:14px}
.form label{display:grid;gap:6px;font-size:14px;font-weight:600}
.form input,.form select,.form textarea{border:1px solid var(--bd2);background:var(--card);border-radius:var(--rb);padding:13px 14px;font-weight:400;outline:none;transition:border-color .15s}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--c)}
.form .error{color:#dc2626;font-size:13px;min-height:18px}
.ok{padding:16px;border-radius:var(--rb);background:color-mix(in srgb,var(--c) 14%,transparent);font-weight:600}
.mapa{border-radius:var(--r);min-height:280px;background:
  linear-gradient(90deg,color-mix(in srgb,var(--tx) 6%,transparent) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(color-mix(in srgb,var(--tx) 6%,transparent) 1px,transparent 1px) 0 0/40px 40px,var(--sf);position:relative;overflow:hidden;border:1px solid var(--bd)}
.mapa::before{content:"";position:absolute;inset:auto -10% 30% -10%;height:18px;background:color-mix(in srgb,var(--c) 30%,transparent);transform:rotate(-8deg)}
.mapa .pin{position:absolute;left:52%;top:42%;transform:translate(-50%,-100%);color:var(--c)}
.mapa .pin .ico{width:44px;height:44px;fill:var(--c);stroke:var(--card)}
.datos-c{display:grid;gap:14px;margin-top:22px}
.datos-c div{display:flex;gap:12px;align-items:center}
.datos-c .ico{color:var(--c)}
footer{padding:56px 0 34px;border-top:1px solid var(--bd);font-size:14px;color:var(--mu)}
footer .fcols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:32px}
footer b{color:var(--tx);display:block;margin-bottom:10px}
footer .legal{margin-top:36px;padding-top:20px;border-top:1px solid var(--bd);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.wa{position:fixed;right:20px;bottom:20px;z-index:30;width:58px;height:58px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.45);border:0;cursor:pointer}
.wa .ico{width:28px;height:28px}
.aviso{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:#111;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:70;max-width:90vw;text-align:center}
.aviso.on{opacity:1;transform:translate(-50%,0)}
.revela{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s}
.revela.vista{opacity:1;transform:none}

/* Herramientas por sector */
.herr{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:start}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:28px;box-shadow:var(--sh)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd2);background:transparent;border-radius:var(--rb);padding:9px 14px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s}
.chip.on,.chip:hover{border-color:var(--c);color:var(--c)}
.chip.on{background:color-mix(in srgb,var(--c) 12%,transparent)}
.total{font-family:var(--fh);font-weight:var(--hw);font-size:40px;color:var(--c);line-height:1.1;margin:10px 0}
input[type=range]{width:100%;accent-color:var(--c)}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dias button,.horas button{border:1px solid var(--bd2);background:transparent;border-radius:var(--rb);padding:10px 2px;cursor:pointer;font-size:13px;line-height:1.3;transition:.15s}
.dias button.on,.horas button.on{background:var(--c);border-color:var(--c);color:var(--ctx)}
.dias button:disabled{opacity:.35;cursor:not-allowed}
.horas{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.horas button{padding:9px 14px}
.carta .fila{display:flex;align-items:baseline;gap:10px;padding:14px 0;border-bottom:1px dashed var(--bd2)}
.carta .fila .lin{flex:1;border-bottom:1px dotted var(--bd2);transform:translateY(-4px)}
.carta .fila small{display:block;color:var(--mu);font-size:13px}
.carta .fila>b:last-child{white-space:nowrap}
.ad{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;user-select:none}
.ad .lado{position:absolute;inset:0;display:grid;place-items:end start;padding:14px}
.ad .lado span{background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:5px 10px;border-radius:6px;letter-spacing:.1em}
.ad .despues{clip-path:inset(0 0 0 var(--x,50%))}
.ad .despues span{justify-self:end}
.ad .barra{position:absolute;top:0;bottom:0;left:var(--x,50%);width:3px;background:#fff;transform:translateX(-50%);pointer-events:none}
.ad .barra::after{content:"⟷";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.ad input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize}
.prods{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap)}
.prod{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s}
.prod:hover{transform:translateY(-4px)}
.prod .img{aspect-ratio:1;position:relative;background:color-mix(in srgb,var(--c) 10%,var(--sf))}
.prod .img svg{position:absolute;inset:12%;width:76%;height:76%}
.prod .etq{position:absolute;top:10px;left:10px;background:var(--c);color:var(--ctx);font-size:12px;font-weight:700;padding:4px 9px;border-radius:var(--rb)}
.prod .info{padding:16px;display:flex;flex-direction:column;gap:4px;flex:1}
.prod .precio{font-weight:700;font-size:18px}
.prod .btn{margin-top:auto;padding:10px 14px;font-size:14px}
.cesta-b{position:fixed;right:20px;top:92px;z-index:25;background:var(--tx);color:var(--bg);border:0;border-radius:99px;padding:12px 18px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center;box-shadow:0 12px 26px -10px rgba(0,0,0,.4)}
.cesta-b i{font-style:normal;background:var(--c);color:var(--ctx);border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;padding:0 6px}
.cesta{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);background:var(--card);color:var(--tx);z-index:65;transform:translateX(105%);transition:transform .3s;box-shadow:-20px 0 50px rgba(0,0,0,.25);display:flex;flex-direction:column}
.cesta.on{transform:none}
.cesta header{position:static;display:flex;justify-content:space-between;align-items:center;padding:20px;border-bottom:1px solid var(--bd)}
.cesta .lista{flex:1;overflow:auto;padding:8px 20px}
.cesta .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--bd)}
.cesta .cant{display:flex;align-items:center;gap:8px}
.cesta .cant button{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd2);background:transparent;cursor:pointer}
.cesta footer{padding:20px;border-top:1px solid var(--bd);margin:0}
.envio{height:8px;border-radius:99px;background:var(--sf);overflow:hidden;margin:8px 0 14px}.envio i{display:block;height:100%;background:var(--c);transition:width .3s}
.quiz .opc{display:grid;gap:10px;margin-top:16px}
.quiz .opc button{text-align:left;border:1px solid var(--bd2);background:transparent;border-radius:var(--rb);padding:14px 16px;cursor:pointer;font-weight:600;transition:.15s}
.quiz .opc button:hover{border-color:var(--c);color:var(--c)}
.barra-q{height:6px;background:var(--sf);border-radius:99px;overflow:hidden;margin-bottom:20px}.barra-q i{display:block;height:100%;background:var(--c);transition:width .3s}
.precios{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)}
.precio-c{display:flex;flex-direction:column;gap:12px}
.precio-c.top{border-color:var(--c);box-shadow:0 0 0 2px var(--c),var(--sh)}
.precio-c .cifra-p{font-family:var(--fh);font-weight:var(--hw);font-size:42px;line-height:1}
.precio-c ul{list-style:none;display:grid;gap:8px;color:var(--mu);font-size:15px;margin-bottom:8px}
.precio-c li::before{content:"✓ ";color:var(--c);font-weight:700}
.qr{width:168px;height:168px;display:grid;grid-template-columns:repeat(21,1fr);background:#fff;padding:10px;border-radius:14px;flex-shrink:0}
.qr i{background:#111}.qr i.v{background:transparent}

/* ===================== Estilo 1 · Moderno ===================== */
body.moderno{--fh:"Plus Jakarta Sans",system-ui,sans-serif;--fb:"Plus Jakarta Sans",system-ui,sans-serif;--fq:"Plus Jakarta Sans",sans-serif;--hw:800;--tt:none;--ls:-.03em;--h1:68px;--h2:46px;
  --bg:#ffffff;--sf:#f5f7fb;--card:#ffffff;--tx:#0f172a;--mu:#5b6478;--bd:#e7eaf1;--bd2:#d5dae5;--ctx:#fff;
  --r:22px;--rh:30px;--rb:14px;--ri:14px;--bw:2px;--btt:none;--bls:0;--sh:0 20px 45px -28px rgba(15,23,42,.35);--sp:104px;--hp:64px;--gap:22px;--ar:5/5.2}
body.moderno header{background:rgba(255,255,255,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
body.moderno .heroe{background:radial-gradient(1200px 500px at 85% -10%,color-mix(in srgb,var(--c) 20%,transparent),transparent),radial-gradient(800px 400px at -10% 110%,color-mix(in srgb,var(--c) 10%,transparent),transparent)}
body.moderno .heroe .w{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
body.moderno .heroe h1 .acento{background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 55%,#7c3aed));-webkit-background-clip:text;background-clip:text;color:transparent}
body.moderno .kick{background:color-mix(in srgb,var(--c) 10%,#fff);border:1px solid color-mix(in srgb,var(--c) 25%,#fff);padding:7px 14px;border-radius:99px;letter-spacing:.02em;text-transform:none}
body.moderno .chapa.c1{left:-18px;bottom:28px}body.moderno .chapa.c2{right:-10px;top:26px}
body.moderno .arte{overflow:visible}body.moderno .arte .lienzo{position:absolute;inset:0;border-radius:inherit;overflow:hidden;background:inherit}
body.moderno .cinta{display:none}

/* ===================== Estilo 2 · Elegante ===================== */
body.elegante{--fh:"Cormorant Garamond",Georgia,serif;--fb:"Inter",system-ui,sans-serif;--fq:"Cormorant Garamond",Georgia,serif;--hw:500;--tt:none;--ls:-.01em;--h1:84px;--h2:56px;
  --bg:#fbf9f5;--sf:#f3efe8;--card:#fffdf9;--tx:#1d1a16;--mu:#6e675d;--bd:#e6dfd3;--bd2:#d6ccbc;--ctx:#fff;
  --r:2px;--rh:2px;--rb:0;--ri:50%;--bw:1px;--btt:uppercase;--bls:.16em;--sh:none;--sp:120px;--hp:90px;--gap:30px;--ar:4/5}
body.elegante header{background:var(--bg);border-bottom:1px solid var(--bd)}
body.elegante .nav{height:auto;flex-direction:column;gap:12px;padding:20px 0 14px}
body.elegante .logo{font-size:30px;font-style:italic}
body.elegante .logo .marca{display:none}body.elegante .logo .marca.foto-logo{display:grid;width:46px;height:46px}
body.elegante .enlaces{margin:0;gap:34px;font-size:12px;letter-spacing:.22em;text-transform:uppercase}
body.elegante .nav>.btn{display:none}
body.elegante .heroe{text-align:center}
body.elegante .heroe .w{display:grid;gap:56px;justify-items:center}
body.elegante .heroe h1{font-style:italic;max-width:16ch;margin:0 auto}
body.elegante .heroe .acento{font-style:normal;color:var(--tx);border-bottom:1px solid var(--c)}
body.elegante .heroe .lead{margin-left:auto;margin-right:auto}

function heroe() {
  const p = P(), t = p.titulo, minimal = E.estilo === "minimal", elegante = E.estilo === "elegante";
  const arte = `<figure class="arte"><div class="lienzo">${ilustracion(E.sector, minimal)}</div>${p.chapas.map((c, i) => `<div class="chapa c${i + 1}">${ico(c[0])}${esc(c[1])}</div>`).join("")}${elegante ? `<figcaption>${esc(p.galeria[0])} · ${v("ciudad")}</figcaption>` : ""}</figure>`;
  const texto = `<div><div class="kick">${conCiudad(p.kick)}</div><h1>${conCiudad(t[0])} <span class="acento">${esc(t[1])}</span></h1>
    ${minimal ? "" : `<p class="lead">${v("eslogan")}</p>`}
    ${minimal ? "" : `<div class="ctas"><a class="btn" href="#herramienta">${esc(p.cta)}</a><a class="btn s" href="#servicios">Saber más</a></div>`}
    ${minimal || elegante ? "" : `<div class="confianza">${p.cifras.slice(0, 3).map(c => `<div><b>${esc(c[0])}</b>${esc(c[1])}</div>`).join("")}</div>`}</div>`;
  if (minimal) return `<section class="heroe" id="inicio"><div class="w">${texto}<div class="fila-h"><p class="lead" style="margin:0">${v("eslogan")}</p><div class="ctas"><a class="btn" href="#herramienta">${esc(p.cta)} →</a><a class="btn s" href="#servicios">Servicios</a></div></div>${arte}</div></section>`;

  const r = [], el = document.getElementById("quiz");
  const paso = () => { const i = r.length;
    if (i === preg.length) { el.innerHTML = `<div class="barra-q"><i style="width:100%"></i></div><h3>Tu caso: ${esc(r[0])}</h3><p class="mu" style="margin:10px 0 18px">${r[1].startsWith("Sí") ? "Lo tratamos con prioridad: te llamamos hoy mismo." : "Te proponemos una primera consulta para estudiarlo con calma."} Atención: ${esc(r[2].toLowerCase())}.</p><div class="ok">Recomendación: <b>${r[0].includes("Impuestos") ? "Iguala autónomos" : "Consulta con un especialista"}</b></div><button type="button" class="btn" style="margin-top:18px" onclick="aviso('En tu web, el cliente reserva aquí su consulta.')">Reservar consulta</button> <button type="button" class="btn s" style="margin-top:18px" id="otra">Empezar de nuevo</button>`;
      document.getElementById("otra").onclick = () => { r.length = 0; paso(); }; return; }
    el.innerHTML = `<div class="barra-q"><i style="width:${i / preg.length * 100}%"></i></div><div class="mu" style="font-size:14px">Pregunta ${i + 1} de ${preg.length}</div><h3 style="margin-top:6px">${preg[i][0]}</h3><div class="opc">${preg[i][1].map(o => `<button type="button">${esc(o)}</button>`).join("")}</div>`;
    el.querySelectorAll(".opc button").forEach(b => b.onclick = () => { r.push(b.textContent); paso(); }); };
  paso();
}

// ------------------------------ Montaje ------------------------------
function montar() {
  const p = P();
  document.body.className = E.estilo;
  document.documentElement.style.setProperty("--c", /^#[0-9a-f]{6}$/i.test(E.color) ? E.color : COLOR_DEF[E.sector]);
  const secs = p.secciones.filter(s => visible(s[1]));
  document.getElementById("enlaces").innerHTML = secs.map(s => `<a href="#${s[1]}">${esc(s[0])}</a>`).join("");
  document.getElementById("movil").innerHTML = secs.map(s => `<a href="#${s[1]}">${esc(s[0])}</a>`).join("");
  const orden = E.sector === "tienda" ? [heroe, cinta, herramienta, servicios, cifras, proceso, opiniones, faq, contacto]
    : E.sector === "hosteleria" ? [heroe, cinta, herramienta, servicios, galeria, cifras, opiniones, faq, contacto]
    : [heroe, cinta, servicios, cifras, herramienta, proceso, galeria, opiniones, faq, contacto];
  const ids = { galeria: "trabajos", opiniones: "opiniones", faq: "faq", proceso: "proceso", cifras: "cifras" };
  document.querySelectorAll(".cesta,.cesta-b").forEach(x => x.remove());
  document.getElementById("main").innerHTML = orden.filter(f => !ids[f.name] || visible(ids[f.name])).map(f => f()).join("");
  document.getElementById("pie").innerHTML = pie();
  pintarTextos(); revelar(); conectar();
}
function pintarTextos() {
  document.querySelectorAll("[data-v]").forEach(e => { e.textContent = val(e.dataset.v); });
  const m = document.getElementById("marca"), n = val("nombre");
  m.className = "marca" + (E.logo ? " foto-logo" : "");
  m.innerHTML = E.logo ? `<img src="${E.logo}" alt="">` : esc(n.trim().charAt(0).toUpperCase());
  document.title = n + " · Vista previa";
}
function revelar() {
  const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("vista"); io.unobserve(e.target); } }), { threshold: .12 }) : null;
  document.querySelectorAll(".revela").forEach((el, i) => { el.style.transitionDelay = (i % 4) * 70 + "ms"; io ? io.observe(el) : el.classList.add("vista"); });
}
function conectar() {
  const ob = document.getElementById("obra");
  if (ob) { const calc = () => { const m2 = +document.getElementById("m2").value, cal = +document.querySelector("#cal .on").dataset.cal, base = { "baño": 4200, cocina: 6800, integral: 380, pintura: 9 }[ob.value], k = [0.8, 1, 1.35][cal];
      const total = ob.value === "baño" || ob.value === "cocina" ? base * k * Math.max(.8, m2 / 10) : base * k * m2;
      document.getElementById("m2v").textContent = m2; document.getElementById("total").textContent = (Math.round(total / 50) * 50).toLocaleString("es-ES") + " €"; };
    ob.onchange = calc; document.getElementById("m2").oninput = calc;
    document.getElementById("cal").onclick = e => { const b = e.target.closest(".chip"); if (!b) return; document.querySelectorAll("#cal .chip").forEach(o => o.classList.toggle("on", o === b)); calc(); }; calc(); }
  const adr = document.getElementById("adr"); if (adr) adr.oninput = () => document.getElementById("ad").style.setProperty("--x", adr.value + "%");
  const ops = [...document.querySelectorAll(".op")], puntos = [...document.querySelectorAll("[data-op]")];
  const verOp = i => { ops.forEach((o, j) => o.classList.toggle("on", j === i)); puntos.forEach((b, j) => b.classList.toggle("on", j === i)); conectar.op = i; };
  puntos.forEach(b => b.onclick = () => { verOp(+b.dataset.op); clearInterval(conectar.t); });
  clearInterval(conectar.t); if (ops.length) conectar.t = setInterval(() => verOp(((conectar.op || 0) + 1) % ops.length), 6000);
  document.querySelectorAll("[data-foto]").forEach(b => b.onclick = () => { const i = +b.dataset.foto; document.getElementById("visor-m").innerHTML = foto(i, E.sector); document.getElementById("visor-t").textContent = P().galeria[i]; document.getElementById("visor").classList.add("on"); });
  const f = document.getElementById("form-c");
  if (f) f.onsubmit = e => { e.preventDefault(); const d = Object.fromEntries(new FormData(f)), err = document.getElementById("err-c");
    if (!d.n.trim()) return err.textContent = "Escribe tu nombre.";
    if (!/\S+@\S+\.\S+|^[0-9 +]{9,}$/.test(d.c.trim())) return err.textContent = "Escribe un teléfono o un correo válido.";
    if (!d.p) return err.textContent = "Acepta la política de privacidad.";
    f.innerHTML = `<div class="ok">✓ ¡Gracias, ${esc(d.n.trim())}! Mensaje de prueba enviado. En tu web te llegará al correo al momento.</div>`; };
}
// Sombra de la cabecera al bajar
addEventListener("scroll", () => document.querySelector("header").style.boxShadow = scrollY > 10 && document.body.className !== "oscuro" ? "0 10px 30px -20px rgba(0,0,0,.35)" : "", { passive: true });

// Personalización en vivo desde el portal
addEventListener("message", e => {
  const m = e.data;
  if (!m || m.tipo !== "webcare-preview") return;
  const d = m.datos || {}, antes = E.sector + E.estilo + E.ocultas.join();
  for (const k of ["nombre", "eslogan", "telefono", "ciudad"]) if (typeof d[k] === "string") E[k] = d[k].slice(0, k === "eslogan" ? 160 : 60);
  if (typeof d.color === "string") E.color = /^#[0-9a-f]{6}$/i.test(d.color) ? d.color : "";
  if (typeof d.logo === "string") E.logo = /^data:image\/(png|jpe?g|webp|gif|svg\+xml);base64,/.test(d.logo) && d.logo.length < 600000 ? d.logo : "";
  if (S[d.sector]) E.sector = d.sector;
  if (["moderno", "elegante", "minimal", "oscuro", "calido"].includes(d.estilo)) E.estilo = d.estilo;
  if (Array.isArray(d.ocultas)) E.ocultas = d.ocultas.filter(x => ["trabajos", "opiniones", "faq", "cifras", "proceso"].includes(x));
  if (antes !== E.sector + E.estilo + E.ocultas.join()) { const y = scrollY; montar(); scrollTo(0, Math.min(y, document.body.scrollHeight)); }
  else { document.documentElement.style.setProperty("--c", /^#[0-9a-f]{6}$/i.test(E.color) ? E.color : COLOR_DEF[E.sector]); pintarTextos(); }
});
montar();
if (parent !== window) parent.postMessage({ tipo: "webcare-preview-lista" }, "*");
</script>
